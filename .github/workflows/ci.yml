name: CI & Automated Packaging

on:
  push:
    branches: [main, "feat/*", "**/feat/*"]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    name: Run Pytest & Hypothesis Verification
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}

      - name: Sync dependencies
        run: uv sync --all-groups

      - name: Run test suite with Hypothesis statistics
        run: uv run pytest -v --hypothesis-show-statistics --durations=10

  build-and-publish:
    name: Build & Publish to phosphene-py-packages
    needs: [test]
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build wheel and source distributions
        run: |
          uv build --out-dir dist/
          ls -la dist/

      - name: Test local wheel installation and smoke test
        run: |
          uv venv test-env
          source test-env/bin/activate
          uv pip install dist/*.whl
          python -c "import phosphene.holonomy; print('phosphene.holonomy loaded successfully')"
          python -c "from phosphene.holonomy.macroevo import evaluate_with_background_realization; print('background realization loaded successfully')"

      - name: Upload wheel artifacts
        uses: actions/upload-artifact@v4
        with:
          name: holonomy-distributions
          path: dist/*

      - name: Publish package to phosphene-py-packages
        env:
          GH_APP_ID: ${{ secrets.GH_APP_ID }}
          GH_APP_INSTALLATION_ID: ${{ secrets.GH_APP_INSTALLATION_ID }}
          GH_APP_PEM: ${{ secrets.GH_APP_PEM }}
        run: |
          python3 -m pip install pyjwt cryptography
          python3 scripts/publish_to_packages.py
